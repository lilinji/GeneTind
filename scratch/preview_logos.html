<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GeneTind Logo Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background: #888;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .card.dark {
      background: #060911;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .card.light {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      color: #111;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
    .logo-box {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }
    .logo-box img {
      height: 36px;
      width: auto;
    }
    .logo-box-lg img {
      height: 60px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="grid">
    <!-- Dark Mode Card -->
    <div class="card dark">
      <h2>DARK MODE (深色模式 #060911)</h2>
      <p style="font-size:13px; opacity:0.6;">Header Scale (36px):</p>
      <div class="logo-box">
        <img src="../public/images/logo/logo.svg" alt="Dark Logo" />
      </div>
      <p style="font-size:13px; opacity:0.6;">Large Scale (60px):</p>
      <div class="logo-box-lg">
        <img src="../public/images/logo/logo.svg" alt="Dark Logo Large" />
      </div>
    </div>

    <!-- Light Mode Card -->
    <div class="card light">
      <h2>LIGHT MODE (浅色模式 #FFFFFF)</h2>
      <p style="font-size:13px; opacity:0.6;">Header Scale (36px):</p>
      <div class="logo-box">
        <img src="../public/images/logo/logo-2.svg" alt="Light Logo" />
      </div>
      <p style="font-size:13px; opacity:0.6;">Large Scale (60px):</p>
      <div class="logo-box-lg">
        <img src="../public/images/logo/logo-2.svg" alt="Light Logo Large" />
      </div>
    </div>
  </div>
</body>
</html>
